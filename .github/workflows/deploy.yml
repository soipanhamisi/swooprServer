name: Deploy to GCP VM

on:
  push:
    branches:
      - gcp-vm-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_PASSPHRASE: ${{ secrets.VM_SSH_PASSPHRASE }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${VM_SSH_PASSPHRASE:-}" ]; then
            ssh-keygen -p -P "$VM_SSH_PASSPHRASE" -N "" -f ~/.ssh/deploy_key
          fi

          ssh-keyscan -p "${VM_PORT:-22}" -H "$VM_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -p "${VM_PORT:-22}" \
            -o BatchMode=yes \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            "$VM_USER@$VM_HOST" <<'EOF'
          set -e
          cd /home/soipanhani/Swoopr
          git pull origin gcp-vm-deployment
          docker compose up -d --build
          docker compose ps
          EOF