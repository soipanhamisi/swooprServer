name: Deploy to GCP VM

on:
  push:
    branches:
      - gcp-vm-deployment

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_HOST_FINGERPRINT: ${{ secrets.VM_HOST_FINGERPRINT }}
          VM_HOST_KEY_ALGORITHM: ${{ vars.VM_HOST_KEY_ALGORITHM }}
          VM_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          trap 'rm -f ~/.ssh/deploy_key /tmp/known_host_entry; if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null; fi' EXIT

          for required_var in VM_HOST VM_USER VM_SSH_KEY VM_HOST_FINGERPRINT VM_HOST_KEY_ALGORITHM; do
            if [ -z "${!required_var:-}" ]; then
              echo "::error::$required_var must be set."
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"
          ssh-add -D >/dev/null 2>&1 || true

          if ! ssh-add ~/.ssh/deploy_key < /dev/null; then
            echo "::error::VM_SSH_KEY must be an unencrypted private key that can be loaded non-interactively."
            exit 1
          fi

          case "$VM_HOST_KEY_ALGORITHM" in
            ssh-ed25519)
              SSH_KEYSCAN_KEY_TYPE="ed25519"
              SSH_HOST_KEY_ALGORITHMS="$VM_HOST_KEY_ALGORITHM"
              ;;
            ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521)
              SSH_KEYSCAN_KEY_TYPE="ecdsa"
              SSH_HOST_KEY_ALGORITHMS="$VM_HOST_KEY_ALGORITHM"
              ;;
            ssh-rsa)
              SSH_KEYSCAN_KEY_TYPE="rsa"
              SSH_HOST_KEY_ALGORITHMS="+ssh-rsa"
              ;;
            *)
              echo "::error::Unsupported VM_HOST_KEY_ALGORITHM: $VM_HOST_KEY_ALGORITHM"
              exit 1
              ;;
          esac

          if ! ssh-keyscan -t "$SSH_KEYSCAN_KEY_TYPE" -p "${VM_PORT:-22}" "$VM_HOST" > /tmp/known_host_entry || [ ! -s /tmp/known_host_entry ]; then
            echo "::error::Unable to retrieve a host key from $VM_HOST."
            exit 1
          fi

          if [ "$(ssh-keygen -lf /tmp/known_host_entry -E sha256 | awk '{ print $2 }')" != "$VM_HOST_FINGERPRINT" ]; then
            echo "::error::Host fingerprint mismatch for $VM_HOST."
            exit 1
          fi

          cat /tmp/known_host_entry >> ~/.ssh/known_hosts

          DEPLOY_KEY_ALGORITHM="$(ssh-add -L | awk 'NR == 1 { print $1 }')"

          if [ -z "$DEPLOY_KEY_ALGORITHM" ]; then
            echo "::error::Unable to determine the loaded deploy key algorithm."
            exit 1
          fi

          SSH_OPTIONS=(
            -p "${VM_PORT:-22}"
            -o BatchMode=yes
            -o "HostKeyAlgorithms=$SSH_HOST_KEY_ALGORITHMS"
            -o StrictHostKeyChecking=yes
          )

          if [ "$DEPLOY_KEY_ALGORITHM" = "ssh-rsa" ]; then
            SSH_OPTIONS+=(-o "PubkeyAcceptedAlgorithms=+ssh-rsa")
          fi

          ssh \
            "${SSH_OPTIONS[@]}" \
            "$VM_USER@$VM_HOST" <<'EOF'
          set -e
          cd /home/soipanhani/Swoopr
          git pull origin gcp-vm-deployment
          docker compose up -d --build
          docker compose ps
          EOF